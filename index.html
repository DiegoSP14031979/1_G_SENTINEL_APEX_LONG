<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-SENTINEL // APEX LONG - Fondos Laboral Kutxa</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --accent-blue: #00f0ff;
            --accent-green: #3fb950;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-blue); padding-bottom: 10px; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 20px; color: var(--accent-blue); letter-spacing: 1px; }
        .grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; }
        .card-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
        .card-value { font-size: 22px; font-weight: bold; margin: 8px 0; color: #fff; }
        .card-sub { font-size: 12px; color: var(--accent-green); }
        .charts-container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 25px; }
        .rebalance-box { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>G-SENTINEL // APEX LONG</h1>
        <span id="last-update" style="color: var(--text-muted); font-size: 12px;">Cargando...</span>
    </div>
    <div class="grid-kpi">
        <div class="card">
            <div class="card-title">Patrimonio Fondos</div>
            <div class="card-value" id="total-val">-- €</div>
            <div class="card-sub">+5.329,85 € (+25.04%)</div>
        </div>
        <div class="card">
            <div class="card-title">LK Bolsa Japón FI</div>
            <div class="card-value" id="bj-val">-- €</div>
            <div class="card-sub" id="bj-weight">--% Peso</div>
        </div>
        <div class="card">
            <div class="card-title">LK Bolsa Universal FI</div>
            <div class="card-value" id="bu-val">-- €</div>
            <div class="card-sub" id="bu-weight">--% Peso</div>
        </div>
    </div>
    <div class="charts-container">
        <div class="card"><canvas id="historyChart" height="120"></canvas></div>
        <div class="card"><canvas id="weightChart" height="120"></canvas></div>
    </div>
    <div class="rebalance-box">
        <div style="color: var(--accent-blue); font-weight: bold; margin-bottom: 8px;">Matriz de Rebalanceo & Asesoría de Traspasos</div>
        <div id="rebalance-status" style="font-size: 13px; font-family: monospace;">Evaluando ponderaciones actuales...</div>
    </div>
    <script>
        async function loadData() {
            try {
                const res = await fetch('fondos_lk.json');
                const data = await res.json();
                document.getElementById('last-update').innerText = 'Actualizado: ' + data.timestamp;
                document.getElementById('total-val').innerText = data.patrimonio_fondos_total.toLocaleString('es-ES') + ' €';
                document.getElementById('bj-val').innerText = data.fondos.LK_BJ_FI.valor_total_eur.toLocaleString('es-ES') + ' €';
                document.getElementById('bj-weight').innerText = data.kpis.peso_lk_bj + '% Peso';
                document.getElementById('bu-val').innerText = data.fondos.LK_BU_FI.valor_total_eur.toLocaleString('es-ES') + ' €';
                document.getElementById('bu-weight').innerText = data.kpis.peso_lk_bu + '% Peso';

                const statusBox = document.getElementById('rebalance-status');
                if (data.kpis.peso_lk_bj > 55) {
                    statusBox.innerHTML = `<span style="color:#f85149">[ALERTA]</span> LK Bolsa Japón ha alcanzado el ${data.kpis.peso_lk_bj}%. Sugerencia: Traspasar a LK Bolsa Universal FI.`;
                } else {
                    statusBox.innerHTML = `<span style="color:var(--accent-green)">[ESTADO NEUTRAL]</span> Cartera dentro de rangos normales (${data.kpis.peso_lk_bj}% BJ / ${data.kpis.peso_lk_bu}% BU). No se requieren traspasos.`;
                }

                new Chart(document.getElementById('weightChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['LK Bolsa Japón', 'LK Bolsa Universal'],
                        datasets: [{ data: [data.kpis.peso_lk_bj, data.kpis.peso_lk_bu], backgroundColor: ['#00f0ff', '#58a6ff'] }]
                    },
                    options: { plugins: { legend: { labels: { color: '#c9d1d9' } } } }
                });
            } catch (e) { console.error("Error cargando JSON:", e); }
        }
        loadData();
    </script>
</body>
</html>
