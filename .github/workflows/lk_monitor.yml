name: G-SENTINEL AGENT RUNNER - APEX LONG

on:
  # 1. Ejecución automática de Lunes a Viernes cada 15 min (Horario comercial/mercado)
  schedule:
    - cron: '*/15 8-22 * * 1-5'
  
  # 2. Permitir ejecución manual desde la pestaña Actions
  workflow_dispatch:

  # 3. Activación remota por Webhook / API (Ping de respaldo externo antipánico)
  repository_dispatch:
    types: [trigger_sentinel]

jobs:
  execute-sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar Bot APEX LONG (Fondos LK)
        run: python fetch_funds.py

      - name: Commit y Push de Estado JSON
        run: |
          git config --global user.name "G-SENTINEL-BOT"
          git config --global user.email "bot@g-sentinel.local"
          git add fondos_lk.json historial_fondos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: Pata 1 APEX LONG auto-sync [skip ci]" && git push)
